services:
  api:
    restart: always
    # Backend istället för .    ???
    build: .
    environment:
      - FACEIT_API_KEY=${FACEIT_API_KEY}
    ports: ["5000:5000"]
    volumes: ["./backend:/app"]
    depends_on: [mongo]
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    restart: always
    volumes: ["mongo:/data/db"]
volumes: { mongo: {} }
